<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price File Generator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root {
    --bg:#0a0a0c; --panel:#131317; --panel2:#1a1a20; --line:#2a2a33;
    --orange:#ff7a18; --orange-2:#ff9d45; --text:#f3f3f5; --muted:#9a9aa6;
    --ok:#4ade80; --err:#ff6b5e;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; color:var(--text);
    font:16px/1.55 "Inter",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(255,122,24,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(255,122,24,.08), transparent 55%),
      var(--bg);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:720px; margin:0 auto; padding:56px 20px 90px; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .logo {
    width:46px; height:46px; border-radius:12px; flex:none;
    background:linear-gradient(140deg,var(--orange),#e85d00);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px; color:#0a0a0c;
    box-shadow:0 8px 26px rgba(255,122,24,.35);
  }
  h1 { font-size:27px; font-weight:800; letter-spacing:-.02em; margin:0; }
  h1 span { color:var(--orange); }
  p.sub { margin:0 0 30px; color:var(--muted); font-size:15px; }
  .card {
    background:linear-gradient(180deg,var(--panel),#0f0f13);
    border:1px solid var(--line); border-radius:18px; padding:26px;
    margin-bottom:20px; box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  #drop {
    border:2px dashed #3a3a45; border-radius:16px; padding:48px 20px;
    text-align:center; cursor:pointer; transition:.18s ease; background:var(--panel2);
  }
  #drop:hover { border-color:#4a4a58; }
  #drop.hover {
    border-color:var(--orange); background:rgba(255,122,24,.08);
    box-shadow:0 0 0 4px rgba(255,122,24,.12) inset;
  }
  #drop .big { font-size:16px; font-weight:600; }
  #drop strong { color:var(--orange); }
  .filename { margin-top:14px; font-weight:700; color:var(--orange-2); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  label { display:block; font-size:12px; font-weight:700; text-transform:uppercase;
          letter-spacing:.04em; margin-bottom:6px; color:var(--muted); }
  input[type=text], select {
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:11px;
    font-size:15px; background:#0e0e12; color:var(--text); outline:none; transition:.15s;
  }
  input[type=text]:focus, select:focus {
    border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,122,24,.2);
  }
  .row-check { display:flex; align-items:center; gap:10px; margin-top:18px; font-size:14px; color:var(--muted); }
  .row-check input { accent-color:var(--orange); width:17px; height:17px; }
  button {
    background:linear-gradient(140deg,var(--orange),#ec6100); color:#0a0a0c; border:0;
    border-radius:12px; padding:14px 24px; font-size:16px; font-weight:800; cursor:pointer;
    transition:.15s ease; box-shadow:0 10px 26px rgba(255,122,24,.3);
  }
  button:hover { transform:translateY(-1px); box-shadow:0 14px 32px rgba(255,122,24,.42); }
  button:active { transform:translateY(0); }
  button:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; transform:none; }
  button.secondary {
    background:transparent; color:var(--orange-2); border:1px solid var(--line);
    padding:9px 16px; font-size:13px; font-weight:700; box-shadow:none;
  }
  button.secondary:hover { border-color:var(--orange); transform:none; box-shadow:none; }
  .actions { margin-top:24px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  details { margin-top:8px; }
  summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); }
  summary:hover { color:var(--text); }
  #summary { display:none; }
  #summary.show { display:block; }
  .file-out {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1px solid var(--line); border-radius:12px; padding:13px 16px; margin-top:10px;
    background:var(--panel2);
  }
  .file-out .nm { font-weight:700; word-break:break-all; font-size:14px; }
  .badge { font-size:12px; padding:4px 11px; border-radius:20px;
           background:rgba(74,222,128,.14); color:var(--ok); }
  .err { color:var(--err); margin-top:14px; white-space:pre-wrap; font-size:14px; }
  .muted { color:var(--muted); font-size:14px; }
  code { background:#0e0e12; border:1px solid var(--line); padding:1px 6px; border-radius:6px; font-size:.9em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">T</div>
    <h1>Supplier <span>Price File</span> Generator</h1>
  </div>
  <p class="sub">Drop a supplier price list — get the 3 import files back. Everything runs in your browser; nothing is uploaded.</p>

  <div class="card">
    <div id="drop">
      <div class="big">Drag an Excel file here, or <strong>click to choose</strong></div>
      <div class="muted" style="margin-top:6px">.xlsx / .xls</div>
      <div class="filename" id="fname"></div>
    </div>
    <input type="file" id="file" accept=".xlsx,.xls" hidden>

    <div id="opts" style="display:none; margin-top:22px">
      <div class="grid">
        <div>
          <label>Output name</label>
          <input type="text" id="stem">
        </div>
        <div id="sheetWrap" style="display:none">
          <label>Source sheet</label>
          <select id="sheet"></select>
        </div>
      </div>
      <div class="row-check">
        <input type="checkbox" id="cct" checked>
        <label for="cct" style="margin:0">Append CCT suffix from code (…Z1L → “ - 4K”, …Z1R → “ - 3K”)</label>
      </div>

      <details>
        <summary>Advanced (brand / supplier code)</summary>
        <div class="grid" style="margin-top:12px">
          <div><label>Bin Location / brand</label><input type="text" id="brand" value="FUMAGALLI"></div>
          <div><label>Supplier code</label><input type="text" id="supplier" value="W001"></div>
          <div><label>Product code prefix</label><input type="text" id="prefix" value="W/"></div>
        </div>
      </details>

      <div class="actions">
        <button id="go">Generate 3 files</button>
        <span class="muted" id="hint">Files download automatically.</span>
      </div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="card" id="summary">
    <div id="meta" class="muted" style="margin-bottom:6px"></div>
    <div id="files"></div>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="generator.js"></script>
<script>
(function () {
  var XLSX = window.XLSX, PriceGen = window.PriceGen;
  var workbook = null, lastOutputs = null;
  var $ = function (id) { return document.getElementById(id); };

  var drop = $("drop"), fileInput = $("file");
  drop.addEventListener("click", function () { fileInput.click(); });
  ["dragenter", "dragover"].forEach(function (e) {
    drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add("hover"); });
  });
  ["dragleave", "drop"].forEach(function (e) {
    drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove("hover"); });
  });
  drop.addEventListener("drop", function (ev) {
    if (ev.dataTransfer.files.length) handleFile(ev.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function stemOf(name) { return name.replace(/\.[^.]+$/, ""); }

  function handleFile(file) {
    $("err").textContent = "";
    $("fname").textContent = file.name;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        workbook = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
      } catch (err) { showErr("Could not read the file: " + err.message); return; }
      $("stem").value = stemOf(file.name);
      var sel = $("sheet");
      sel.innerHTML = "";
      workbook.SheetNames.forEach(function (n) {
        var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o);
      });
      $("sheetWrap").style.display = workbook.SheetNames.length > 1 ? "block" : "none";
      $("opts").style.display = "block";
      $("summary").classList.remove("show");
    };
    reader.readAsArrayBuffer(file);
  }

  function showErr(msg) { $("err").textContent = msg; }

  $("go").addEventListener("click", function () {
    if (!workbook) return;
    $("err").textContent = "";
    try {
      var sheetName = $("sheet").value || workbook.SheetNames[0];
      var ws = workbook.Sheets[sheetName];
      var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      var out = PriceGen.buildFiles(XLSX, aoa, {
        stem: $("stem").value || "OUTPUT",
        brand: $("brand").value.trim(),
        supplierCode: $("supplier").value.trim(),
        prefix: $("prefix").value,
        cct: $("cct").checked
      });
      lastOutputs = out;
      out.files.forEach(function (f) { download(f); });
      renderSummary(out);
    } catch (err) { showErr("Could not generate files:\n" + err.message); }
  });

  function download(f) {
    var blob = new Blob([f.data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function renderSummary(out) {
    $("summary").classList.add("show");
    var m = out.meta;
    $("meta").textContent = "Processed " + m.count + " product row(s). Price column: “" +
      (m.priceName || "?") + "”." + (m.skipped.length ? " Skipped " + m.skipped.length + " row(s)." : "");
    var box = $("files"); box.innerHTML = "";
    out.files.forEach(function (f) {
      var d = document.createElement("div"); d.className = "file-out";
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = f.name;
      var b = document.createElement("button"); b.className = "secondary"; b.textContent = "Download again";
      b.onclick = function () { download(f); };
      d.appendChild(nm); d.appendChild(b); box.appendChild(d);
    });
    if (m.skipped.length) {
      var s = document.createElement("div"); s.className = "muted"; s.style.marginTop = "10px";
      s.textContent = "Skipped: " + m.skipped.map(function (x) { return x.code + " (" + x.why + ")"; }).join("; ");
      box.appendChild(s);
    }
  }
})();
</script>
</body>
</html>
